<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="96" viewBox="0 0 1200 96" role="img" aria-label="Página 4 · Automação &amp; RPA">
<title>Página 4 · Automação &amp; RPA</title>
<defs>
  <linearGradient id="pbi" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F2C811"/><stop offset="1" stop-color="#E8A317"/>
  </linearGradient>
  <linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F2C811"/><stop offset="1" stop-color="#C67A0A"/>
  </linearGradient><linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#F2C811" stop-opacity="0"/><stop offset=".5" stop-color="#F2C811"/><stop offset="1" stop-color="#F2C811" stop-opacity="0"/></linearGradient>
<style>
  text{font-family:'Segoe UI','Segoe UI Variable',system-ui,-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;}
  .mono{font-family:'Cascadia Code','Cascadia Mono',Consolas,'SFMono-Regular',Menlo,monospace;}
  .bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .up{animation:up .7s ease-out both;}
  @keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .fade{animation:fade .6s ease-out both;}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .draw{stroke-dasharray:900;stroke-dashoffset:900;animation:draw 1.8s ease-out 1.1s forwards;}
  @keyframes draw{to{stroke-dashoffset:0}}
  .pulse{animation:pulse 2s ease-in-out infinite;}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .sweep{animation:sweep 4.5s ease-in-out infinite;}
  @keyframes sweep{0%{transform:translateX(-300px)}100%{transform:translateX(1500px)}}

  .eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 2.6s ease-in-out infinite alternate;}
  @keyframes eq{0%{transform:scaleY(1)}35%{transform:scaleY(.55)}70%{transform:scaleY(1.08)}100%{transform:scaleY(.8)}}
  .breath{animation:breath 3.2s ease-in-out infinite;}
  @keyframes breath{0%,100%{opacity:.55}50%{opacity:1}}
  .caret{animation:caret 1s steps(1) infinite;}
  @keyframes caret{50%{opacity:0}}
  .float{animation:float 5s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  .shine{transform-box:fill-box;animation:shine 3.6s ease-in-out infinite;}
  @keyframes shine{0%{transform:translateX(-120%)}60%,100%{transform:translateX(320%)}}
</style>
</defs>
<clipPath id="c"><rect width="1200" height="96" rx="10"/></clipPath><g clip-path="url(#c)">
<rect width="1200" height="96" fill="#1F1E1D"/>
<rect width="6" height="96" fill="url(#pbi)"/>
<rect class="sweep" x="0" y="93" width="260" height="3" fill="url(#shine)"/>
<text x="34" y="36" font-size="11.5" font-weight="700" fill="#F2C811" letter-spacing="3">PÁGINA 04 · ROBÔS E AUTOMAÇÕES</text>
<text x="32" y="74" font-size="30" font-weight="800" fill="#F3F2F1">Automação &amp; RPA</text>
<g class="eq" style="animation-delay:1.20s"><rect class="bar" style="animation-delay:0.2s" x="1000" y="56" width="9" height="14" rx="1.5" fill="url(#barg)" opacity="0.45"/></g>
<g class="eq" style="animation-delay:1.43s"><rect class="bar" style="animation-delay:0.3s" x="1014" y="46" width="9" height="24" rx="1.5" fill="url(#barg)" opacity="0.56"/></g>
<g class="eq" style="animation-delay:1.66s"><rect class="bar" style="animation-delay:0.4s" x="1028" y="52" width="9" height="18" rx="1.5" fill="url(#barg)" opacity="0.67"/></g>
<g class="eq" style="animation-delay:1.89s"><rect class="bar" style="animation-delay:0.5s" x="1042" y="38" width="9" height="32" rx="1.5" fill="url(#barg)" opacity="0.78"/></g>
<g class="eq" style="animation-delay:2.12s"><rect class="bar" style="animation-delay:0.6s" x="1056" y="44" width="9" height="26" rx="1.5" fill="url(#barg)" opacity="0.89"/></g>
<g class="eq" style="animation-delay:2.35s"><rect class="bar" style="animation-delay:0.7s" x="1070" y="30" width="9" height="40" rx="1.5" fill="url(#barg)" opacity="1.00"/></g>
<path d="M1000 74H1083" stroke="#4A4846"/>
<g fill="none" stroke="#7A7876" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M1100 32h12l-4.5 5.5v4.5l-3-1.5v-3z"/><path d="M1126 36v-4h4M1138 32h4v4M1142 40v4h-4M1130 44h-4v-4"/></g><g fill="#7A7876"><circle cx="1156" cy="38" r="1.5"/><circle cx="1162" cy="38" r="1.5"/><circle cx="1168" cy="38" r="1.5"/></g>
<circle cx="1178" cy="76" r="3.5" fill="#1AAB40" class="pulse"/>
</g>
<rect x=".5" y=".5" width="1199" height="95" rx="10" fill="none" stroke="#3B3A39"/>
</svg>
